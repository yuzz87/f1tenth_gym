campaign:
  name: real_vehicle_simulation_completeness
  seeds: [123, 456, 789]
  controllers: [mpc, mppi]
  scenarios: [straight, circle]
  pose_sources: [ground_truth, localized]
  plant_profiles: [ideal, nominal, degraded]
  lidar_profiles: [ideal, realistic]
  network_profiles: [normal, delayed, dropout, outage]
  save_trajectories: false

evaluation:
  control_rates_hz:
    mpc: 50.0
    mppi: 100.0
  straight_duration_s: 15.0
  circle_duration_s: 42.9
  scan_timeout_s: 0.30
  pose_timeout_s: 0.20
  control_timeout_s: 0.10
  course_error_limit_m: 1.0

plant_profiles:
  ideal:
    enabled: false
  nominal: {}
  degraded:
    enabled: true
    speed_time_constant_s: 0.18
    steer_time_constant_s: 0.12
    speed_deadband_mps: 0.01
    steer_deadband_rad: 0.01
    steer_neutral_offset_rad: 0.01
    battery_speed_scale: 0.85
    longitudinal_slip_ratio: 0.08
    cornering_gain: 0.85

lidar_profiles:
  ideal: {}
  realistic:
    noise_std_m: 0.01
    distance_noise_slope: 0.002
    dropout_probability: 0.03
    burst_start_probability: 0.01
    burst_length_scans: 2
    delay_s: 0.03
    delay_jitter_s: 0.01
    timestamp_jitter_s: 0.002
    update_rate_jitter_fraction: 0.05
    x_offset_m: 0.02
    y_offset_m: 0.0
    yaw_offset_rad: 0.01

network_profiles:
  normal: {}
  delayed:
    sensor_delay_s: 0.05
    sensor_delay_jitter_s: 0.01
    control_delay_s: 0.025
    control_delay_jitter_s: 0.005
  dropout:
    sensor_dropout_probability: 0.05
    control_dropout_probability: 0.05
    control_burst_start_probability: 0.01
    control_burst_length: 3
  outage:
    control_outage_after_s: 2.0
    control_outage_duration_s: 1.0
