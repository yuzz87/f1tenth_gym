run_name: homur_oval_localized_a1_mppi_high_speed_5mps
controller_type: mppi

map_path: experiments/maps/homur_oval
map_ext: .png
wpt_path: experiments/maps/homur_oval_waypoints.csv

sx: 3.0
sy: 0.0
stheta: 1.57079632679
wpt_delim: ";"
wpt_rowskip: 3
wpt_xind: 1
wpt_yind: 2
wpt_thind: 3
wpt_vind: 5

num_agents: 1
timestep: 0.01
integrator: RK4
lidar_dist: 0.0

lidar:
  profile: rplidar_a1m8_r6
  scan_rate_hz: 10.0
  x_offset: 0.0
  y_offset: 0.0
  z_offset: 0.0
  yaw_offset: 0.0

controller:
  # 5 m/sクラスの長時間評価で安定した候補。
  horizon: 8
  num_samples: 64
  target_speed: 4.8
  temperature: 0.5
  noise_sigma: 0.08
  position_weight: 4.0
  heading_weight: 0.8
  terminal_position_weight: 8.0
  terminal_heading_weight: 1.5
  control_weight: 0.02
  delta_weight: 0.8
  nominal_weight: 1.2
  steer_limit: 0.36
  tlad: 0.8
  vgain: 4.8
  seed: 7

localizer:
  type: map_localizer
  update_mode: on_scan_update
  scan_beams: 180
  xy_search_radius: 0.04
  theta_search_radius: 0.08
  xy_candidates: 3
  theta_candidates: 5
  score_penalty: 0.3
  motion_prior_weight: 2.0
  heading_prior_weight: 0.6
  scan_noise_std: 0.0
  preserve_scan_angles: false
  scan_time_compensation: true
  scan_motion_history_compensation: true
  motion_history_seconds: 1.0
  ignore_invalid_beams: true
  min_valid_beams: 20
  hold_pose_on_invalid_scan: true
  initialization_noise: [0.0, 0.0, 0.0]

car_params:
  mu: 1.0489
  C_Sf: 4.718
  C_Sr: 5.4562
  lf: 0.15875
  lr: 0.17145
  h: 0.074
  m: 3.74
  I: 0.04712
  s_min: -0.4189
  s_max: 0.4189
  sv_min: -3.2
  sv_max: 3.2
  v_switch: 7.319
  a_max: 9.51
  v_min: -5.0
  v_max: 20.0
  width: 0.31
  length: 0.58
